services:
  - type: web
    name: disaster-management-backend
    runtime: node
    plan: free
    region: oregon
    buildCommand: npm install && cd client && npm install && npm run build
    startCommand: node server/server.js
    healthCheckPath: /health
    autoDeploy: true
    envVars:
      - key: NODE_ENV
        value: production
      - key: PORT
        value: 10000
